<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embedded player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      video {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <video controls preload="metadata">
      <source src="sample.mp4" type="video/mp4" />
    </video>
  </body>
</html>
